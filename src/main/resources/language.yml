  next: "&a下一页 →"
  page: "&7第 %page%/%pages% 页"
  back: "&e← 返回上级"
  back-lore: "&7返回到 &f%group%"
  close: "&c关闭"
  close-lore: "&7关闭菜单"
  root-name: "&f&l全部物品"
  root-label: "根目录"
  current: "&e当前位置"
  return-root: "&7点击返回根目录"
  jump: "&7点击跳转至此"
  path: "&8路径：%path%"
  browse-group: "&7点击浏览分组"
  subgroup-count: "&7子分组：&f%count%"
  item-count: "&7物品数：&f%count%"
  enter: "&8» 点击进入"
  obtain: "&8» 点击获取"
  obtained: "%prefix%&a已获得物品 &f%item%"
  obtain-failed: "%prefix%&c物品领取失败：&f%item%"


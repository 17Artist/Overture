# Overture 语言文件
# 支持 & 颜色代码；每条消息中可用的变量已经直接写在默认值里。

prefix: "&6Overture &8» &r"

common:
  none: "无"
  unknown: "未知"
  yes: "是"
  no: "否"
  success: "成功"
  failed: "失败"
  not-available: "不可用"
  rejected: "已拒绝"

command:
  description:
    list: "浏览物品列表"
    give: "发放物品"
    get: "领取物品"
    rebuild: "重新生成手持物品"
    serialize: "查看手持物品的序列化数据"
    info: "查看手持物品信息"
    diagnostics: "查看扩展注册信息"
    inspect: "查看物品和重载诊断"
    reload: "重载插件配置"

  op-only: "%prefix%&c该命令仅限 OP 使用"
  player-only: "%prefix%&c该命令必须由游戏内 OP 玩家执行"
  player-not-found: "%prefix%&c未找到玩家 &f%player%"
  item-not-found: "%prefix%&c未找到物品 &f%item%"
  definition-not-found: "%prefix%&c物品定义不存在：&f%item%"
  hold-item: "%prefix%&c请先手持一个物品"
  not-overture-item: "%prefix%&c手持物品不是 Overture 物品"

  give:
    success: "%prefix%&a已将 &f%amount%x %item% &a发放给 &f%player%"
    failed: "%prefix%&c物品发放失败"
  get:
    success: "%prefix%&a已获得 &f%amount%x %item%"
    failed: "%prefix%&c物品领取失败"
  rebuild:
    cancelled: "%prefix%&c物品更新被其他插件取消"
    success: "%prefix%&a手持物品已更新"
  serialize:
    header: "&a--- 序列化数据 ---"

  info:
    header: "&a--- 物品信息 ---"
    id: "&7ID：&f%value%"
    version: "&7版本：&f%value%"
    data: "&7数据：&f%value%"
    unique: "&7唯一标识：&f%value%"
    owner: "&7持有者：&f%value%"
    created-at: "&7创建时间：&f%value%"

  diagnostics:
    components-header: "&a--- 组件注册信息 ---"
    registries-header: "&a--- 扩展注册信息 ---"
    empty: "&7没有注册项"
    entry: "&7%value%"
    usage: "%prefix%&c用法：/ot diagnostics components"

  inspect:
    reload-header: "&a--- 最近一次重载 ---"
    reload-summary: "&7结果：%status% &7耗时：&f%duration%ms &7物品/模型：&f%items%/%models%"
    reload-problems: "&7问题：&f%errors% 个错误，%warnings% 个警告，%conflicts% 个冲突"
    issue: "%color%[%source%] item=%item% path=%path% component=%component% owner=%owner%：%message%"
    reload-conflict: "&e[%type%:%id%] %previous% 与 %candidate%，生效来源：%winner%"
    usage: "%prefix%&c用法：/ot inspect <item|reload|registries>，或手持一个 Overture 物品"
    item-header: "&a--- %item% ---"
    origin: "&7来源：&f%provider% &7(%owner%@%priority%)"
    version: "&7版本：&f定义=%definition%，物品=%stack%，需要更新=%outdated%"
    meta: "&7Meta：&f%value%"
    display: "&7Display：&f%value%"
    components: "&7Components：&f%value%"
    behaviors: "&7Behaviors：&f%value%"
    actions: "&7动作：&f%value%"
    models: "&7事件模型：&f%value%"
    item-conflict: "&e冲突：%previous% 与 %candidate%；生效来源=%winner%"
    action-trace: "&7最近动作链：&f%value%"
    timings: "&7扩展耗时：&f%value%"
    no-build-record: "&7最近动作链/耗时：&f暂无构建记录"

  reload:
    success: "%prefix%&a重载完成：%items% 个物品，%models% 个模型，%warnings% 个警告"
    failed: "%prefix%&c重载失败：%errors% 个错误。使用 &f/ot inspect reload &c查看详情"
    language-failed: "%prefix%&e语言文件读取失败，继续使用当前内容。请检查控制台"

menu:
  title:
    root: "&8Overture"
    group: "&8Overture » %group%"

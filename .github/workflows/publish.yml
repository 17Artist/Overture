name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Maven release version (for example 1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Resolve release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Invalid Maven release version: ${version}"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew clean build -Pversion="${RELEASE_VERSION}" --no-daemon --max-workers=1

      - name: Publish to Maven repository
        env:
          repo: ${{ secrets.MAVEN_REPO_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "${repo}" ]]; then
            echo "::error::MAVEN_REPO_PASSWORD is not configured"
            exit 1
          fi
          ./gradlew publishShadowPublicationToMavenRepository -Pversion="${RELEASE_VERSION}" --no-daemon --max-workers=1

      - name: Verify published Maven artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          MAVEN_BASE_URL: https://repo.arcartx.com/repository/maven-releases
        shell: bash
        run: |
          artifact_base="${MAVEN_BASE_URL}/priv/seventeen/artist/overture/overture/${RELEASE_VERSION}/overture-${RELEASE_VERSION}"
          mkdir -p build/published-verification

          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --output build/published-verification/overture.pom \
            "${artifact_base}.pom"
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --output build/published-verification/overture.jar \
            "${artifact_base}.jar"

          test -s build/published-verification/overture.pom
          test -s build/published-verification/overture.jar
          grep -Fq '<groupId>priv.seventeen.artist.overture</groupId>' build/published-verification/overture.pom
          grep -Fq '<artifactId>overture</artifactId>' build/published-verification/overture.pom
          grep -Fq "<version>${RELEASE_VERSION}</version>" build/published-verification/overture.pom
          jar tf build/published-verification/overture.jar | grep -Fxq 'plugin.yml'
          sha256sum build/published-verification/overture.jar

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overture-${{ steps.version.outputs.version }}
          path: build/libs/Overture-*.jar
          if-no-files-found: error

      - name: Publish summary
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "### Maven publication verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Coordinate: \`priv.seventeen.artist.overture:overture:${RELEASE_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
